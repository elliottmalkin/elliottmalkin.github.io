<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finesse — Snack Signup</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Netlify Identity Widget -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
  :root {
    --green: #1a3a2a;
    --green-mid: #2d5a3d;
    --green-light: #4a8c5c;
    --accent: #c8f06a;
    --white: #f5f2eb;
    --cream: #ede9de;
    --grey: #8a8a7a;
    --grey-light: #d4d0c4;
    --text: #1a1a14;
    --radius: 4px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--green);
    color: var(--white);
    padding: 40px 24px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 60% 0%, rgba(200,240,106,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .logo-emoji {
    font-size: 56px;
    line-height: 1;
    display: block;
    margin: 0 auto 14px;
  }
  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2.4rem, 6vw, 3.8rem);
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1;
    color: var(--white);
  }
  .season-label {
    font-size: 15px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 8px;
    font-weight: 500;
  }
  .page-subtitle {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(1.05rem, 2.4vw, 1.25rem);
    font-weight: 400;
    color: var(--white);
    margin-top: 6px;
    letter-spacing: 0.02em;
  }

  /* Admin bar */
  #adminBar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--green);
    border-top: 1px solid rgba(200,240,106,0.2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    z-index: 200;
    font-size: 12.5px;
    color: var(--accent);
    letter-spacing: 0.06em;
  }
  #adminBar .admin-label { font-weight: 600; text-transform: uppercase; font-size: 11px; }
  #adminBar .admin-name  { opacity: 0.7; font-size: 12px; }
  .btn-admin-action {
    background: none;
    border: 1px solid rgba(200,240,106,0.35);
    color: var(--accent);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-admin-action:hover { background: rgba(200,240,106,0.1); }

  /* ── MAIN ── */
  main {
    max-width: 700px;
    margin: 0 auto;
    padding: 32px 16px 80px;
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--grey);
    font-weight: 600;
    margin-bottom: 16px;
    padding-left: 2px;
  }

  #statusBar {
    font-size: 12px;
    color: var(--grey);
    text-align: center;
    padding: 6px;
    min-height: 26px;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }
  #statusBar.error { color: #8b1a1a; }

  /* ── GAME CARD ── */
  .game-card {
    background: var(--white);
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    transition: box-shadow 0.15s;
  }
  .game-card:hover { box-shadow: 0 3px 16px rgba(0,0,0,0.1); }

  .game-header {
    display: flex;
    align-items: center;
    padding: 16px 20px;
    gap: 16px;
  }

  .game-date-block {
    font-family: 'DM Serif Display', serif;
    color: #6a6a5a;
    min-width: 36px;
    text-align: center;
    line-height: 1.1;
    flex-shrink: 0;
  }
  .game-date-block .month {
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: block;
  }
  .game-date-block .day { font-size: 1.6rem; display: block; }

  .game-info { flex: 1; min-width: 0; }

  .game-opponent {
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .game-meta {
    font-size: 12.5px;
    color: var(--grey);
    margin-top: 2px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .game-meta span { display: inline-flex; align-items: center; gap: 3px; }

  .badge {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 3px;
  }
  .badge-home { background: rgba(200,240,106,0.18); color: #5a7a1a; }
  .badge-away { background: rgba(180,40,40,0.1);   color: #8b1a1a; }

  .game-snack {
    padding: 0 20px 16px 68px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .claimed-by {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: var(--green-mid);
    font-weight: 500;
  }
  .claimed-by .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .btn-signup {
    font-family: 'DM Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 8px 16px;
    border: 1.5px solid var(--green);
    background: transparent;
    color: var(--green);
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .btn-signup:hover { background: var(--green); color: var(--accent); }

  .btn-edit {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: var(--grey);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }
  .btn-edit:hover { color: var(--green); }

  .divider { width: 1px; height: 14px; background: var(--grey-light); flex-shrink: 0; }

  /* ── MODALS ── */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(26,26,20,0.55);
    backdrop-filter: blur(3px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--white);
    border-radius: 10px;
    width: 100%;
    max-width: 420px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.22);
    transform: translateY(12px);
    transition: transform 0.2s;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-backdrop.open .modal { transform: translateY(0); }

  .modal-game-info {
    border-bottom: 1px solid var(--grey-light);
    padding-bottom: 18px;
    margin-bottom: 22px;
  }
  .modal-game-info h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.35rem;
    font-weight: 400;
  }
  .modal-game-info p { font-size: 13px; color: var(--grey); margin-top: 4px; }

  label {
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--grey);
    margin-bottom: 7px;
  }

  input[type="text"],
  input[type="email"],
  input[type="tel"] {
    width: 100%;
    padding: 10px 13px;
    border: 1.5px solid var(--grey-light);
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 14.5px;
    color: var(--text);
    background: var(--white);
    transition: border-color 0.15s;
    outline: none;
    margin-bottom: 18px;
  }
  input:focus { border-color: var(--green-light); }

  .field-row { margin-bottom: 18px; }
  .field-row label { margin-bottom: 8px; }

  .toggle-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .toggle-btn {
    flex: 1;
    min-width: 60px;
    padding: 9px 8px;
    border: 1.5px solid var(--grey-light);
    background: transparent;
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.12s;
    text-align: center;
    color: var(--text);
  }
  .toggle-btn.active { background: var(--green); border-color: var(--green); color: var(--accent); }

  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }

  .btn-primary {
    flex: 1;
    padding: 12px;
    background: var(--green);
    color: var(--accent);
    border: none;
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--green-mid); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

  .btn-secondary {
    padding: 12px 18px;
    background: transparent;
    color: var(--grey);
    border: 1.5px solid var(--grey-light);
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.12s;
  }
  .btn-secondary:hover { border-color: var(--grey); color: var(--text); }

  .btn-danger {
    padding: 12px 18px;
    background: transparent;
    color: #8b1a1a;
    border: 1.5px solid rgba(180,40,40,0.3);
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.12s;
  }
  .btn-danger:hover  { background: rgba(180,40,40,0.08); border-color: #8b1a1a; }
  .btn-danger:disabled { opacity: 0.55; cursor: not-allowed; }

  .error-msg { font-size: 12px; color: #c0392b; margin-top: -12px; margin-bottom: 12px; }

  .remind-details { margin-top: 14px; display: none; flex-direction: column; gap: 14px; }
  .remind-details.show { display: flex; }

  /* Edit-token callout shown after signup */
  .token-callout {
    background: #f0fce8;
    border: 1.5px solid #b6e87a;
    border-radius: 6px;
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.55;
    color: var(--green-mid);
    margin-top: 20px;
  }
  .token-callout strong { display: block; margin-bottom: 4px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
  .token-link {
    display: block;
    margin-top: 8px;
    word-break: break-all;
    font-size: 11.5px;
    font-family: monospace;
    color: var(--green);
    background: rgba(0,0,0,0.04);
    padding: 6px 8px;
    border-radius: 4px;
  }
  .btn-copy {
    margin-top: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 6px 12px;
    background: var(--green);
    color: var(--accent);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
  }
  .btn-copy:hover { background: var(--green-mid); }

  /* Admin badge */
  .admin-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    background: var(--accent);
    color: var(--green);
    padding: 2px 8px;
    border-radius: 3px;
    margin-bottom: 12px;
  }

  footer {
    text-align: center;
    font-size: 11.5px;
    color: var(--grey);
    padding: 24px;
    border-top: 1px solid var(--grey-light);
    margin-top: 16px;
  }

  /* Admin login link in footer */
  #adminLoginLink {
    display: inline-block;
    margin-top: 8px;
    font-size: 11px;
    color: var(--grey-light);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  #adminLoginLink:hover { color: var(--grey); }

  @media (max-width: 480px) {
    .game-snack { padding-left: 20px; }
    .game-date-block { display: none; }
  }
</style>
</head>
<body>

<header>
  <span class="logo-emoji">⚽</span>
  <h1>Finesse</h1>
  <div class="season-label">Spring 2026</div>
  <div class="page-subtitle">Post-Game Snack Signup</div>
</header>

<main>
  <div id="statusBar">Loading schedule…</div>
  <div class="section-label">Season Schedule</div>
  <div id="gameList"></div>
</main>

<footer>
  Finesse · Spring 2026
  <br>
  <span id="adminLoginLink" onclick="handleAdminAuth()">Admin</span>
</footer>

<!-- Fixed admin bar — only shown when logged in as admin -->
<div id="adminBar" style="display:none">
  <div>
    <span class="admin-label">Admin Mode</span>
    <span class="admin-name" id="adminEmail"></span>
  </div>
  <button class="btn-admin-action" onclick="netlifyIdentity.logout()">Sign Out</button>
</div>

<!-- ── SIGNUP MODAL ── -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-game-info">
      <h3 id="modalTitle"></h3>
      <p id="modalSubtitle"></p>
    </div>

    <!-- Step 1: signup form -->
    <div id="signupForm">
      <div class="field-row">
        <label for="parentName">Your Name</label>
        <input type="text" id="parentName" placeholder="e.g. Alex Johnson" autocomplete="name">
        <div class="error-msg" id="nameError" style="display:none">Please enter your name.</div>
      </div>

      <div class="field-row">
        <label>Reminder?
          <span style="font-size:10px;font-weight:400;letter-spacing:0.04em;text-transform:none;color:var(--grey);margin-left:4px;"># of days prior</span>
        </label>
        <div class="toggle-group">
          <button class="toggle-btn" data-remind="none" onclick="setRemind('none')">None</button>
          <button class="toggle-btn" data-remind="1"    onclick="setRemind('1')">1 Day</button>
          <button class="toggle-btn" data-remind="2"    onclick="setRemind('2')">2 Days</button>
          <button class="toggle-btn" data-remind="3"    onclick="setRemind('3')">3 Days</button>
        </div>
      </div>

      <div class="remind-details" id="remindDetails">
        <div class="field-row" style="margin-bottom:0">
          <label>Remind me by</label>
          <div class="toggle-group">
            <button class="toggle-btn" data-how="text"  onclick="setHow('text')">Text</button>
            <button class="toggle-btn" data-how="email" onclick="setHow('email')">Email</button>
            <button class="toggle-btn" data-how="both"  onclick="setHow('both')">Both</button>
          </div>
        </div>
        <div id="phoneField" style="display:none">
          <label for="parentPhone">Phone Number</label>
          <input type="tel" id="parentPhone" placeholder="(555) 867-5309" autocomplete="tel" style="margin-bottom:0">
        </div>
        <div id="emailField" style="display:none">
          <label for="parentEmail">Email Address</label>
          <input type="email" id="parentEmail" placeholder="you@example.com" autocomplete="email" style="margin-bottom:0">
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-primary" id="claimBtn" onclick="confirmSignup()">Claim This Game ✓</button>
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      </div>
    </div>

    <!-- Step 2: shown after successful signup, with edit link -->
    <div id="signupSuccess" style="display:none">
      <div class="token-callout">
        <strong>✓ You're signed up!</strong>
        Save this private link — it's the only way to edit or cancel your signup later.
        <span class="token-link" id="tokenDisplay"></span>
        <button class="btn-copy" onclick="copyToken()">Copy Link</button>
      </div>
      <div class="modal-actions" style="margin-top:20px">
        <button class="btn-primary" onclick="closeModal()">Done</button>
      </div>
    </div>
  </div>
</div>

<!-- ── PARENT EDIT MODAL (opened via edit token in URL) ── -->
<div class="modal-backdrop" id="editBackdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-game-info">
      <h3 id="editTitle"></h3>
      <p id="editSubtitle"></p>
    </div>
    <div class="field-row">
      <label for="editName">Your Name</label>
      <input type="text" id="editName" placeholder="Name">
    </div>
    <div class="field-row">
      <label for="editPhone">Phone</label>
      <input type="tel" id="editPhone" placeholder="(555) 000-0000">
    </div>
    <div class="field-row" style="margin-bottom:0">
      <label for="editEmail">Email</label>
      <input type="email" id="editEmail" placeholder="email@example.com" style="margin-bottom:0">
    </div>
    <div class="modal-actions" style="margin-top:24px">
      <button class="btn-primary"   id="editSaveBtn"  onclick="saveParentEdit()">Save Changes</button>
      <button class="btn-danger"    id="editDelBtn"   onclick="removeParentSignup()">Remove My Signup</button>
      <button class="btn-secondary"                   onclick="closeEditModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- ── ADMIN EDIT MODAL ── -->
<div class="modal-backdrop" id="adminBackdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-game-info">
      <div class="admin-badge">Admin</div>
      <h3>Edit Signup</h3>
      <p id="adminGameLabel"></p>
    </div>
    <div class="field-row">
      <label for="adminName">Parent Name</label>
      <input type="text" id="adminName" placeholder="Name">
    </div>
    <div class="field-row">
      <label for="adminPhone">Phone</label>
      <input type="tel" id="adminPhone" placeholder="(555) 000-0000">
    </div>
    <div class="field-row" style="margin-bottom:0">
      <label for="adminEditEmail">Email</label>
      <input type="email" id="adminEditEmail" placeholder="email@example.com" style="margin-bottom:0">
    </div>
    <div class="modal-actions" style="margin-top:24px">
      <button class="btn-primary"   id="adminSaveBtn" onclick="saveAdmin()">Save Changes</button>
      <button class="btn-danger"    id="adminDelBtn"  onclick="removeAdminSignup()">Remove</button>
      <button class="btn-secondary"                   onclick="closeAdminModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// GAMES — loaded from games.json at the repo root.
// Edit that file to add, remove, or change games. No need to touch this file.
// ─────────────────────────────────────────────────────────────────────────────
let GAMES = [];

// ── STATE ─────────────────────────────────────────────────────────────────────
let signups      = {};
let activeGameId = null;
let remindDays   = '2';
let remindHow    = 'text';
let isAdmin      = false;    // true once Netlify Identity confirms admin
let lastToken    = null;     // token generated after a parent signs up

// ── NETLIFY IDENTITY (ADMIN AUTH) ─────────────────────────────────────────────
netlifyIdentity.on('init', user => {
  if (user) setAdminMode(true, user.email);
});
netlifyIdentity.on('login', user => {
  setAdminMode(true, user.email);
  netlifyIdentity.close();
  render();
});
netlifyIdentity.on('logout', () => {
  setAdminMode(false);
  render();
});

function handleAdminAuth() {
  if (isAdmin) {
    netlifyIdentity.logout();
  } else {
    netlifyIdentity.open('login');
  }
}

function setAdminMode(on, email) {
  isAdmin = on;
  const bar = document.getElementById('adminBar');
  bar.style.display = on ? 'flex' : 'none';
  if (on && email) document.getElementById('adminEmail').textContent = email;
  document.getElementById('adminLoginLink').textContent = on ? 'Sign out (Admin)' : 'Admin';
}

// ── STATUS BAR ────────────────────────────────────────────────────────────────
function setStatus(msg, isError) {
  const bar = document.getElementById('statusBar');
  bar.textContent = msg;
  bar.className   = isError ? 'error' : '';
}

// ── API ───────────────────────────────────────────────────────────────────────
async function getAuthHeaders() {
  if (!isAdmin) return { 'Content-Type': 'application/json' };
  const user  = netlifyIdentity.currentUser();
  const token = user ? await user.jwt() : null;
  return {
    'Content-Type': 'application/json',
    ...(token ? { Authorization: `Bearer ${token}` } : {}),
  };
}

async function apiPost(endpoint, body) {
  const headers = await getAuthHeaders();
  const res = await fetch(`/.netlify/functions/${endpoint}`, {
    method: 'POST', headers, body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json().catch(() => ({}));
}

// ── EDIT TOKEN IN URL ─────────────────────────────────────────────────────────
// When a parent visits ?edit=TOKEN we auto-open their edit modal.
function checkEditTokenInUrl() {
  const params = new URLSearchParams(window.location.search);
  const token  = params.get('edit');
  if (!token) return;

  // Find matching signup
  const entry = Object.values(signups).find(s => s.editToken === token);
  if (entry) {
    openEditModal(entry.gameId, token);
  } else {
    setStatus('That edit link is no longer valid (signup may have been removed).', true);
  }
  // Clean the token from the URL bar so it's not accidentally shared
  window.history.replaceState({}, '', window.location.pathname);
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function parseDateBlock(dateStr) {
  const parts = dateStr.split(', ');
  if (parts.length === 2) {
    const [mon, day] = parts[1].split(' ');
    return { month: mon, day };
  }
  return { month: '—', day: '—' };
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  const list = document.getElementById('gameList');
  list.innerHTML = '';

  GAMES.forEach(g => {
    const signup = signups[g.id];
    const { month, day } = parseDateBlock(g.date);

    const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(g.location)}`;
    const locationLine = (!g.home && g.location)
      ? `<span><a href="${mapsUrl}" target="_blank" rel="noopener"
           style="color:var(--grey);text-decoration:underline;text-underline-offset:2px;"
           >📍 ${escHtml(g.location)}</a></span>`
      : '';

    let snackSection;
    if (signup) {
      // Show edit button only if admin OR this user has the edit token in their session
      const canEdit = isAdmin;
      snackSection = `<div class="game-snack">
        <div class="claimed-by"><span class="dot"></span>${escHtml(signup.name)}</div>
        ${canEdit
          ? `<div class="divider"></div>
             <button class="btn-edit" onclick="openAdminModal(${g.id})">Edit / Remove</button>`
          : ''}
      </div>`;
    } else {
      snackSection = `<div class="game-snack">
        <button class="btn-signup" onclick="openModal(${g.id})">Sign up for Snack</button>
      </div>`;
    }

    const card = document.createElement('div');
    card.className = 'game-card';
    card.innerHTML = `
      <div class="game-header">
        <div class="game-date-block">
          <span class="month">${escHtml(month)}</span>
          <span class="day">${escHtml(day)}</span>
        </div>
        <div class="game-info">
          <div class="game-opponent">
            <span style="font-weight:300;opacity:0.55">vs</span> ${escHtml(g.opponent)}
          </div>
          <div class="game-meta">
            <span>${escHtml(g.time)}</span>
            <span class="badge ${g.home ? 'badge-home' : 'badge-away'}">${g.home ? 'Home' : 'Away'}</span>
            ${locationLine}
          </div>
        </div>
      </div>
      ${snackSection}`;
    list.appendChild(card);
  });
}

// ── SIGNUP MODAL ──────────────────────────────────────────────────────────────
function openModal(gameId) {
  activeGameId = gameId;
  const g = GAMES.find(x => x.id === gameId);

  document.getElementById('modalTitle').textContent    = `vs ${g.opponent}`;
  document.getElementById('modalSubtitle').textContent =
    `${g.date} · ${g.time} · ${g.home ? 'Home' : 'Away'}` +
    (!g.home && g.location ? ` · ${g.location}` : '');

  document.getElementById('parentName').value  = '';
  document.getElementById('parentPhone').value = '';
  document.getElementById('parentEmail').value = '';
  document.getElementById('nameError').style.display = 'none';

  const btn = document.getElementById('claimBtn');
  btn.disabled    = false;
  btn.textContent = 'Claim This Game ✓';

  // Show form, hide success
  document.getElementById('signupForm').style.display    = 'block';
  document.getElementById('signupSuccess').style.display = 'none';

  setRemind('2');
  setHow('text');

  document.getElementById('modalBackdrop').classList.add('open');
  setTimeout(() => document.getElementById('parentName').focus(), 150);
}

function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
  activeGameId = null;
}

document.getElementById('modalBackdrop').addEventListener('click', e => {
  if (e.target === document.getElementById('modalBackdrop')) closeModal();
});

function setRemind(val) {
  remindDays = val;
  document.querySelectorAll('[data-remind]').forEach(b =>
    b.classList.toggle('active', b.dataset.remind === val));
  const show = val !== 'none';
  document.getElementById('remindDetails').classList.toggle('show', show);
  if (!show) {
    remindHow = null;
    document.querySelectorAll('[data-how]').forEach(b => b.classList.remove('active'));
    document.getElementById('phoneField').style.display = 'none';
    document.getElementById('emailField').style.display = 'none';
  }
}

function setHow(val) {
  remindHow = val;
  document.querySelectorAll('[data-how]').forEach(b =>
    b.classList.toggle('active', b.dataset.how === val));
  document.getElementById('phoneField').style.display =
    (val === 'text' || val === 'both') ? 'block' : 'none';
  document.getElementById('emailField').style.display =
    (val === 'email' || val === 'both') ? 'block' : 'none';
}

async function confirmSignup() {
  const name = document.getElementById('parentName').value.trim();
  if (!name) { document.getElementById('nameError').style.display = 'block'; return; }
  document.getElementById('nameError').style.display = 'none';

  const btn = document.getElementById('claimBtn');
  btn.disabled    = true;
  btn.textContent = 'Saving…';

  const payload = {
    gameId:    activeGameId,
    name,
    remindDays,
    remindHow,
    phone: document.getElementById('parentPhone').value.trim(),
    email: document.getElementById('parentEmail').value.trim(),
  };

  try {
    const result = await apiPost('save-signup', payload);
    // Server returns the generated editToken
    lastToken = result.editToken;
    signups[activeGameId] = { ...payload, editToken: lastToken };

    // Show success step with edit link
    const editUrl = `${window.location.origin}${window.location.pathname}?edit=${lastToken}`;
    document.getElementById('tokenDisplay').textContent = editUrl;
    document.getElementById('signupForm').style.display    = 'none';
    document.getElementById('signupSuccess').style.display = 'block';

    render();
    setStatus('');
  } catch {
    setStatus('Could not save — please try again.', true);
    btn.disabled    = false;
    btn.textContent = 'Claim This Game ✓';
  }
}

function copyToken() {
  const link = document.getElementById('tokenDisplay').textContent;
  navigator.clipboard.writeText(link).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy Link'; }, 2000);
  });
}

// ── PARENT EDIT MODAL ─────────────────────────────────────────────────────────
let editToken = null;

function openEditModal(gameId, token) {
  activeGameId = gameId;
  editToken    = token;
  const signup = signups[gameId];
  const g      = GAMES.find(x => x.id === gameId);

  document.getElementById('editTitle').textContent    = `vs ${g.opponent}`;
  document.getElementById('editSubtitle').textContent = `${g.date} · ${g.time}`;
  document.getElementById('editName').value  = signup.name  || '';
  document.getElementById('editPhone').value = signup.phone || '';
  document.getElementById('editEmail').value = signup.email || '';

  const saveBtn = document.getElementById('editSaveBtn');
  const delBtn  = document.getElementById('editDelBtn');
  saveBtn.disabled    = false;
  saveBtn.textContent = 'Save Changes';
  delBtn.disabled     = false;
  delBtn.textContent  = 'Remove My Signup';

  document.getElementById('editBackdrop').classList.add('open');
  setTimeout(() => document.getElementById('editName').focus(), 150);
}

function closeEditModal() {
  document.getElementById('editBackdrop').classList.remove('open');
  activeGameId = null;
  editToken    = null;
}

document.getElementById('editBackdrop').addEventListener('click', e => {
  if (e.target === document.getElementById('editBackdrop')) closeEditModal();
});

async function saveParentEdit() {
  const name = document.getElementById('editName').value.trim();
  if (!name) { alert('Name cannot be empty.'); return; }

  const saveBtn = document.getElementById('editSaveBtn');
  saveBtn.disabled    = true;
  saveBtn.textContent = 'Saving…';

  try {
    await apiPost('save-signup', {
      gameId:    activeGameId,
      editToken,
      name,
      phone:     document.getElementById('editPhone').value.trim(),
      email:     document.getElementById('editEmail').value.trim(),
      remindDays: signups[activeGameId].remindDays,
      remindHow:  signups[activeGameId].remindHow,
    });
    signups[activeGameId] = {
      ...signups[activeGameId],
      name,
      phone: document.getElementById('editPhone').value.trim(),
      email: document.getElementById('editEmail').value.trim(),
    };
    closeEditModal();
    render();
  } catch {
    setStatus('Could not save changes — please try again.', true);
    saveBtn.disabled    = false;
    saveBtn.textContent = 'Save Changes';
  }
}

async function removeParentSignup() {
  if (!confirm('Remove your snack signup?')) return;

  const delBtn = document.getElementById('editDelBtn');
  delBtn.disabled    = true;
  delBtn.textContent = 'Removing…';

  try {
    await apiPost('delete-signup', { gameId: activeGameId, editToken });
    delete signups[activeGameId];
    closeEditModal();
    render();
  } catch {
    setStatus('Could not remove — please try again.', true);
    delBtn.disabled    = false;
    delBtn.textContent = 'Remove My Signup';
  }
}

// ── ADMIN EDIT MODAL ──────────────────────────────────────────────────────────
function openAdminModal(gameId) {
  if (!isAdmin) return;
  activeGameId = gameId;
  const signup = signups[gameId];
  const g      = GAMES.find(x => x.id === gameId);

  document.getElementById('adminGameLabel').textContent = `vs ${g.opponent} · ${g.date}`;
  document.getElementById('adminName').value      = signup.name  || '';
  document.getElementById('adminPhone').value     = signup.phone || '';
  document.getElementById('adminEditEmail').value = signup.email || '';

  const saveBtn = document.getElementById('adminSaveBtn');
  const delBtn  = document.getElementById('adminDelBtn');
  saveBtn.disabled    = false;
  saveBtn.textContent = 'Save Changes';
  delBtn.disabled     = false;
  delBtn.textContent  = 'Remove';

  document.getElementById('adminBackdrop').classList.add('open');
  setTimeout(() => document.getElementById('adminName').focus(), 150);
}

function closeAdminModal() {
  document.getElementById('adminBackdrop').classList.remove('open');
  activeGameId = null;
}

document.getElementById('adminBackdrop').addEventListener('click', e => {
  if (e.target === document.getElementById('adminBackdrop')) closeAdminModal();
});

async function saveAdmin() {
  if (!isAdmin) return;
  const name = document.getElementById('adminName').value.trim();
  if (!name) { alert('Name cannot be empty.'); return; }

  const saveBtn = document.getElementById('adminSaveBtn');
  saveBtn.disabled    = true;
  saveBtn.textContent = 'Saving…';

  try {
    await apiPost('save-signup', {
      gameId:    activeGameId,
      adminEdit: true,
      name,
      phone:     document.getElementById('adminPhone').value.trim(),
      email:     document.getElementById('adminEditEmail').value.trim(),
      remindDays: signups[activeGameId].remindDays,
      remindHow:  signups[activeGameId].remindHow,
      editToken:  signups[activeGameId].editToken, // preserve existing token
    });
    signups[activeGameId] = {
      ...signups[activeGameId],
      name,
      phone: document.getElementById('adminPhone').value.trim(),
      email: document.getElementById('adminEditEmail').value.trim(),
    };
    closeAdminModal();
    render();
  } catch {
    setStatus('Could not save — please try again.', true);
    saveBtn.disabled    = false;
    saveBtn.textContent = 'Save Changes';
  }
}

async function removeAdminSignup() {
  if (!isAdmin) return;
  if (!confirm('Remove this signup?')) return;

  const delBtn = document.getElementById('adminDelBtn');
  delBtn.disabled    = true;
  delBtn.textContent = 'Removing…';

  try {
    await apiPost('delete-signup', { gameId: activeGameId, adminEdit: true });
    delete signups[activeGameId];
    closeAdminModal();
    render();
  } catch {
    setStatus('Could not remove — please try again.', true);
    delBtn.disabled    = false;
    delBtn.textContent = 'Remove';
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeEditModal(); closeAdminModal(); }
});

// ── BOOT ──────────────────────────────────────────────────────────────────────
async function boot() {
  netlifyIdentity.init();

  // Load games and signups in parallel
  try {
    const [gamesRes, signupsRes] = await Promise.all([
      fetch('/games.json'),
      fetch('/.netlify/functions/get-signups'),
    ]);

    if (!gamesRes.ok) throw new Error('Could not load games.json');
    GAMES = await gamesRes.json();

    if (signupsRes.ok) {
      signups = await signupsRes.json();
    } else {
      setStatus('Could not load signups — check your connection.', true);
    }
  } catch (e) {
    setStatus('Could not load schedule — check your connection.', true);
  }

  setStatus('');
  render();
  checkEditTokenInUrl();
}

boot();
</script>
